name: Import notebook

# Run from the Actions tab once a notebook's scan is in the private
# astronomy-scans repo. Opens a pull request with the pages and sessions.
on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "Notebook id, e.g. astronomy-002"
        required: true
      scan:
        description: "PDF in astronomy-scans (default: <notebook id>.pdf)"
        required: false
      title:
        description: "Title for a new notebook (default: read from its label)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-${{ inputs.notebook }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOTEBOOK: ${{ inputs.notebook }}
      SCAN: ${{ inputs.scan || format('{0}.pdf', inputs.notebook) }}
      TITLE: ${{ inputs.title }}
    steps:
      - name: Check inputs
        run: |
          [[ "$NOTEBOOK" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::Notebook id must be lowercase letters, digits and dashes"; exit 1; }
          [[ "$SCAN" != *..* ]] || { echo "::error::Scan path can't contain '..'"; exit 1; }
      - uses: actions/checkout@v4
      - name: Fetch the private scan
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/astronomy-scans
          token: ${{ secrets.SCANS_TOKEN }}
          path: .scans
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: command -v pdfimages || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: npm ci
      - name: Import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          [ -n "$TITLE" ] && args=(--title "$TITLE")
          node scripts/import-notebook.mjs "$NOTEBOOK" ".scans/$SCAN" "${args[@]}" --summary "$RUNNER_TEMP/summary.md"
      - run: npm run validate
      - name: Remove the unredacted scan
        run: rm -rf .scans
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: import/${{ inputs.notebook }}
          title: Import ${{ inputs.notebook }}
          commit-message: Import ${{ inputs.notebook }} from scan
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data
            scans
