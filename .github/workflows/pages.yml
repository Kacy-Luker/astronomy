name: Deploy site

# Publishes the site to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Deploy from a branch → gh-pages), then the test site
# (#64: the same code with the made-up test data shown by default) to
# gh-pages/test/. PR previews live in gh-pages/pr-preview/ and are left alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run validate
      - run: npm run build
      - uses: ./.github/actions/publish
        with:
          folder: dist
          keep: |
            pr-preview/
            test/
      - run: npm run build
        env:
          TEST_SITE: "1"
      - uses: ./.github/actions/publish
        with:
          folder: dist
          target-folder: test
