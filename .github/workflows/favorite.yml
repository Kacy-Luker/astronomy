# Favorites (#23): the site's star (admin mode, object page) opens a new
# issue titled "Favorite: ..." or "Unfavorite: ..." whose body names the
# session and the observation. When Kacy submits it, this sets or clears
# the favorite with scripts/favorite.mjs, opens a pull request, links it on
# the issue and closes the issue. Only issues Kacy (the repo owner) opens
# are acted on.
#
# The pull request merges itself: it's checked here (validation, and only
# session files changed), then GitHub's auto-merge waits for the required
# checks (preview: validate and build; docs) before merging it.
name: Favorite

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  favorite:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'Favorite:') || startsWith(github.event.issue.title, 'Unfavorite:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TITLE: ${{ github.event.issue.title }}
      BODY: ${{ github.event.issue.body }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Read the issue
        run: |
          SESSION=$(printf '%s\n' "$BODY" | sed -n 's/^Session: *\([a-z0-9-]*\) *\r\{0,1\}$/\1/p' | head -1)
          NUMBER=$(printf '%s\n' "$BODY" | sed -n 's/^Observation: *\([0-9]*\) *\r\{0,1\}$/\1/p' | head -1)
          [ -n "$SESSION" ] && [ -n "$NUMBER" ] || { echo "::error::The issue needs 'Session: <id>' and 'Observation: <n>' lines"; exit 1; }
          case "$TITLE" in Unfavorite:*) OFF=--off ;; *) OFF= ;; esac
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"
          echo "NUMBER=$NUMBER" >> "$GITHUB_ENV"
          echo "OFF=$OFF" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Set the favorite
        run: |
          node scripts/favorite.mjs "$SESSION" "$NUMBER" $OFF --summary "$RUNNER_TEMP/summary.md"
          printf '\nCloses #%s\n' "$ISSUE" >> "$RUNNER_TEMP/summary.md"
      - run: npm run validate
      - name: Check only session files changed
        run: |
          OTHER=$(git status --porcelain | grep -v ' data/sessions/[a-z0-9-]*\.json$' || true)
          [ -z "$OTHER" ] || { echo "::error::Unexpected changes:"; echo "$OTHER"; exit 1; }
      - id: pr
        uses: ./.github/actions/open-pr
        with:
          token: ${{ secrets.ASTRONOMY_TOKEN }}
          branch: favorite/${{ env.SESSION }}-${{ env.NUMBER }}
          title: ${{ env.TITLE }}
          commit-message: ${{ env.TITLE }}
          body-path: ${{ runner.temp }}/summary.md
          add-paths: data/sessions
      # Auto-merge needs "Allow auto-merge" on in the repo settings; without
      # it the pull request waits for Kacy to merge it.
      - name: Merge when the checks pass
        id: auto
        if: steps.pr.outputs.pull-request-url
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ASTRONOMY_TOKEN }}
          URL: ${{ steps.pr.outputs.pull-request-url }}
        run: gh pr merge "$URL" --auto --merge
      - name: Link the pull request on the issue
        if: steps.pr.outputs.pull-request-url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pr.outputs.pull-request-url }}
          AUTO: ${{ steps.auto.outcome }}
        run: |
          if [ "$AUTO" = success ]; then NEXT="It merges itself once its checks pass."; else NEXT="Merge it to update the site."; fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Pull request: $URL. $NEXT"
