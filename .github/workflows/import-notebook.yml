name: Import

# Run from the Actions tab after uploading a scan to the private
# astronomy-scans repo as <notebook id>/<date>.pdf. Opens a pull request with
# the new pages and sessions, working out from the form whether it's a new
# notebook, a front cover, re-read pages or a session.
on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "Notebook. For a new one, pick new-notebook: its id is the folder the scan is in (e.g. astronomy-002)"
        type: choice
        options:
          # Written by scripts/sync-workflow.mjs from data/notebooks/.
          # notebooks:start
          - astronomy-001
          - new-notebook
          # notebooks:end
      notebook_type:
        description: "For a new notebook only: what kind it is (data/notebook-types.json). An existing notebook keeps its own"
        type: choice
        default: Stamped log, spreads
        options:
          # Written by scripts/sync-workflow.mjs from data/notebook-types.json.
          # notebook-types:start
          - Stamped log, spreads
          - Free-text log, spreads
          # notebook-types:end
      scan:
        description: "File in astronomy-scans, e.g. astronomy-001/2026-10-23.pdf. Empty = the newest in the notebook's folder (for a new notebook, the one folder without a notebook yet)"
        required: false
      category:
        description: "Optional: put every non-blank page in the scan in this category, when Claude gets it wrong. Front cover imports the scan as the notebook's outside cover"
        type: choice
        default: Detect automatically
        options:
          # Written by scripts/sync-workflow.mjs from data/categories.json.
          # categories:start
          - Detect automatically
          - Front cover
          - Inside front cover
          - Title page
          - Table of contents
          - Scales
          - Session pages
          - Index
          - Notebook info
          - Inside back cover
          # categories:end
      reread:
        description: "Re-read pages already recorded and replace what was recorded for them"
        type: boolean
        default: false
      start_page:
        description: "Optional: the page number of the first session page in the scan, used only when no printed page number could be read"
        required: false

permissions:
  contents: read

# One import at a time, across all three forms.
concurrency:
  group: import

jobs:
  run:
    uses: ./.github/workflows/notebook-job.yml
    secrets: inherit
    with:
      action: Import
      notebook: ${{ inputs.notebook }}
      notebook_type: ${{ inputs.notebook_type }}
      scan: ${{ inputs.scan }}
      category: ${{ inputs.category }}
      reread: ${{ inputs.reread }}
      start_page: ${{ inputs.start_page }}
