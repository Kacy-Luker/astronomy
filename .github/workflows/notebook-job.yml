name: Notebook job

# The steps Import, Complete notebook and Remove notebook share: check the
# form, fetch the scan, run the script, and open a pull request. Called by
# import-notebook.yml, complete-notebook.yml and remove-notebook.yml; it
# isn't run on its own.
on:
  workflow_call:
    inputs:
      action:
        description: "Import, Complete notebook or Remove notebook"
        type: string
        required: true
      notebook:
        type: string
        required: true
      notebook_type:
        type: string
        default: ""
      scan:
        type: string
        default: ""
      category:
        type: string
        default: Detect automatically
      reread:
        type: boolean
        default: false
      start_page:
        type: string
        default: ""
      confirm:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACTION: ${{ inputs.action }}
      PICKED: ${{ inputs.notebook }}
      SCAN: ${{ inputs.scan }}
      START_PAGE: ${{ inputs.start_page }}
      NOTEBOOK_TYPE: ${{ inputs.notebook_type }}
      CATEGORY: ${{ inputs.category != 'Detect automatically' && inputs.category || '' }}
    steps:
      - name: Check inputs
        env:
          REREAD: ${{ inputs.reread }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$ACTION" in
            Import) MODE=add ;;
            "Complete notebook") MODE=complete ;;
            "Remove notebook") MODE=remove ;;
          esac
          [ "$PICKED" != none ] || { echo "::error::There are no notebooks yet; create one with Import and new-notebook"; exit 1; }
          # An import works out what it is from the notebook, category and
          # re-read box: a new notebook, its front cover, re-read pages, or a
          # session.
          if [ "$PICKED" = new-notebook ]; then
            [ "$MODE" = add ] || { echo "::error::Pick an existing notebook for $ACTION"; exit 1; }
            [ "$CATEGORY" != "Front cover" ] || { echo "::error::Import the new notebook's pages first, then its front cover"; exit 1; }
            MODE=new
          elif [ "$MODE" = add ] && [ "$CATEGORY" = "Front cover" ]; then
            MODE=cover
          elif [ "$MODE" = add ] && [ "$REREAD" = true ]; then
            MODE=replace
          elif [ "$MODE" = complete ] && [ "$CATEGORY" = "Front cover" ]; then
            echo "::error::Rescan the front cover with Import, picking Front cover as the category"; exit 1
          fi
          [[ "$SCAN" != *..* ]] || { echo "::error::Scan path can't contain '..'"; exit 1; }
          [[ -z "$START_PAGE" || "$START_PAGE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Start page must be a page number, like 12 (got '$START_PAGE')"; exit 1; }
          if [ "$MODE" = remove ]; then
            [ "$CONFIRM" = "$PICKED" ] || { echo "::error::To remove $PICKED, type $PICKED in the confirm field (got '$CONFIRM')"; exit 1; }
          fi
          case "$MODE" in
            new) TITLE="Create notebook" ;; add) TITLE="Add session" ;; replace) TITLE="Re-read pages" ;;
            cover) TITLE="Front cover" ;; complete) TITLE="Complete notebook" ;; remove) TITLE="Remove notebook" ;;
          esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          [ "$MODE" = new ] || echo "NOTEBOOK=$PICKED" >> "$GITHUB_ENV"
          # The type is only for a new notebook; an existing one keeps its own.
          [ "$MODE" = new ] || echo "NOTEBOOK_TYPE=" >> "$GITHUB_ENV"
          [ "$MODE" != remove ] || echo "BRANCH=remove/$PICKED" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Fetch the private scans
        if: env.MODE != 'remove'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/astronomy-scans
          token: ${{ secrets.ASTRONOMY_TOKEN }}
          path: .scans
      # Stamp show-through is removed by scripts/showthrough.py; PDF scans are
      # opened with poppler. Removing a notebook needs neither.
      - uses: ./.github/actions/setup
        with:
          python: ${{ env.MODE != 'remove' }}
          pdf: ${{ env.MODE != 'remove' }}
      - name: Pick the notebook and scan
        if: env.MODE != 'remove'
        run: node scripts/pick-scan.mjs
      - name: Import
        if: env.MODE != 'remove' && env.MODE != 'cover'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/import-notebook.mjs "$NOTEBOOK" ${SCAN:+".scans/$SCAN"} --mode "$MODE" \
            ${CATEGORY:+--category "$CATEGORY"} ${START_PAGE:+--start "$START_PAGE"} \
            ${NOTEBOOK_TYPE:+--type "$NOTEBOOK_TYPE"} --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Import the front cover
        if: env.MODE == 'cover'
        run: |
          node scripts/import-cover.mjs "$NOTEBOOK" ".scans/$SCAN" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the notebook
        if: env.MODE == 'remove'
        run: |
          node scripts/remove-notebook.mjs "$NOTEBOOK" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the dropdowns
        run: node scripts/sync-workflow.mjs
      - run: npm run validate
      - name: Remove the unredacted scans
        run: rm -rf .scans
      # ASTRONOMY_TOKEN also has write access to this repo: pushing a change to
      # the forms' dropdowns isn't allowed with the built-in token.
      - uses: ./.github/actions/open-pr
        with:
          token: ${{ secrets.ASTRONOMY_TOKEN }}
          branch: ${{ env.BRANCH }}
          title: "${{ env.TITLE }}: ${{ env.NOTEBOOK }}${{ env.SCAN && format(' ({0})', env.SCAN) || '' }}"
          commit-message: "${{ env.TITLE }}: ${{ env.NOTEBOOK }}"
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data
            scans
            .github/workflows/import-notebook.yml
            .github/workflows/complete-notebook.yml
            .github/workflows/remove-notebook.yml
