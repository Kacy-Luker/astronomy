name: Import

# Run from the Actions tab after uploading a scan to the private
# astronomy-scans repo as <notebook id>/<date>.pdf. Opens a pull request
# with the new pages and sessions. Remove notebook opens a pull request that
# deletes a notebook from the site.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: Add session
        options:
          - Add session
          - Create new notebook
          - Replace pages
          - Add front cover
          - Complete notebook
          - Remove notebook
      notebook:
        description: "Notebook (pick new-notebook for Create new notebook)"
        type: choice
        options:
          # Written by scripts/sync-workflow.mjs from data/notebooks/.
          # notebooks:start
          - astronomy-001
          - new-notebook
          # notebooks:end
      new_notebook:
        description: "Create new notebook only (with new-notebook picked above): its id, e.g. astronomy-002"
        required: false
      scan:
        description: "File in astronomy-scans. Empty = the newest in the notebook's folder; for Complete notebook, empty = just mark it completed"
        required: false
      category:
        description: "Optional: put every non-blank page in the scan in this category, when Claude gets it wrong"
        type: choice
        default: Detect automatically
        options:
          # Written by scripts/sync-workflow.mjs from data/categories.json.
          # categories:start
          - Detect automatically
          - Inside front cover
          - Volume label
          - Title page
          - Table of contents
          - Scales
          - Session pages
          - Index
          - Notebook info
          - Inside back cover
          # categories:end
      start_page:
        description: "Optional: the page number of the first session page in the scan, used only when no printed page number could be read"
        required: false
      confirm:
        description: "Remove notebook only: type the selected notebook's id to confirm"
        required: false

permissions:
  contents: read

concurrency:
  group: import

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACTION: ${{ inputs.action }}
      SCAN: ${{ inputs.scan }}
      START_PAGE: ${{ inputs.start_page }}
      CATEGORY: ${{ inputs.category != 'Detect automatically' && inputs.category || '' }}
    steps:
      - name: Check inputs
        env:
          PICKED: ${{ inputs.notebook }}
          NEW: ${{ inputs.new_notebook }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$ACTION" in
            "Add session") MODE=add; NOTEBOOK=$PICKED ;;
            "Create new notebook") MODE=new; NOTEBOOK=$NEW ;;
            "Replace pages") MODE=replace; NOTEBOOK=$PICKED ;;
            "Add front cover") MODE=cover; NOTEBOOK=$PICKED ;;
            "Complete notebook") MODE=complete; NOTEBOOK=$PICKED ;;
            "Remove notebook") MODE=remove; NOTEBOOK=$PICKED ;;
          esac
          # new-notebook in the dropdown goes with Create new notebook, and only with it.
          if [ "$MODE" = new ]; then
            [ "$PICKED" = new-notebook ] || { echo "::error::To create a notebook, pick new-notebook in the notebook dropdown (got '$PICKED')"; exit 1; }
            [ -n "$NOTEBOOK" ] && [ "$NOTEBOOK" != new-notebook ] || { echo "::error::Type the new notebook's id in new_notebook, e.g. astronomy-002"; exit 1; }
          else
            [ "$PICKED" != new-notebook ] || { echo "::error::Pick an existing notebook for $ACTION, or choose Create new notebook"; exit 1; }
          fi
          [[ "$NOTEBOOK" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::Notebook id must be lowercase letters, digits and dashes (got '$NOTEBOOK')"; exit 1; }
          [[ "$SCAN" != *..* ]] || { echo "::error::Scan path can't contain '..'"; exit 1; }
          [[ -z "$START_PAGE" || "$START_PAGE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Start page must be a page number, like 12 (got '$START_PAGE')"; exit 1; }
          if [ "$MODE" = remove ]; then
            [ "$CONFIRM" = "$NOTEBOOK" ] || { echo "::error::To remove $NOTEBOOK, type $NOTEBOOK in the confirm field (got '$CONFIRM')"; exit 1; }
            echo "BRANCH=remove/$NOTEBOOK" >> "$GITHUB_ENV"
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "NOTEBOOK=$NOTEBOOK" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Fetch the private scans
        if: env.MODE != 'remove'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/astronomy-scans
          token: ${{ secrets.SCANS_TOKEN }}
          path: .scans
      - name: Pick the scan
        if: env.MODE != 'remove'
        run: |
          if [ -z "$SCAN" ] && [ "$MODE" != complete ]; then
            # Names are dates (optionally -HHMM), so the newest upload sorts
            # last. Compare without the extension so 2026-10-23.pdf comes
            # before 2026-10-23-1350.pdf.
            SCAN=$(cd .scans && for f in "$NOTEBOOK"/*; do
              [ -f "$f" ] && printf '%s\t%s\n' "${f%.*}" "$f"
            done | LC_ALL=C sort | tail -n 1 | cut -f2)
            [ -n "$SCAN" ] || { echo "::error::No files in astronomy-scans/$NOTEBOOK/"; exit 1; }
          fi
          if [ -n "$SCAN" ]; then
            [ -e ".scans/$SCAN" ] || { echo "::error::astronomy-scans has no $SCAN"; exit 1; }
            echo "Importing $SCAN: $(file -b ".scans/$SCAN"), $(stat -c %s ".scans/$SCAN") bytes"
          fi
          NAME=$(basename "${SCAN:-completed}")
          echo "SCAN=$SCAN" >> "$GITHUB_ENV"
          echo "BRANCH=import/$NOTEBOOK-$MODE-$(echo "${NAME%.*}" | tr -c 'A-Za-z0-9.\n-' '-')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.MODE != 'remove'
        run: command -v pdfimages || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: npm ci
      # Stamp show-through is removed by scripts/showthrough.py.
      - if: env.MODE != 'remove'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - if: env.MODE != 'remove'
        run: pip install -r requirements.txt
      - name: Import
        if: env.MODE != 'remove' && env.MODE != 'cover'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/import-notebook.mjs "$NOTEBOOK" ${SCAN:+".scans/$SCAN"} --mode "$MODE" \
            ${CATEGORY:+--category "$CATEGORY"} ${START_PAGE:+--start "$START_PAGE"} --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Import the front cover
        if: env.MODE == 'cover'
        run: |
          node scripts/import-cover.mjs "$NOTEBOOK" ".scans/$SCAN" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the notebook
        if: env.MODE == 'remove'
        run: |
          node scripts/remove-notebook.mjs "$NOTEBOOK" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Update the notebook dropdown
        run: node scripts/sync-workflow.mjs
      - run: npm run validate
      - name: Remove the unredacted scans
        run: rm -rf .scans
      # SCANS_TOKEN also needs write access to this repo: pushing a change to
      # the workflow's dropdown isn't allowed with the built-in token.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SCANS_TOKEN }}
          branch: ${{ env.BRANCH }}
          title: "${{ inputs.action }}: ${{ env.NOTEBOOK }}${{ env.SCAN && format(' ({0})', env.SCAN) || '' }}"
          commit-message: "${{ inputs.action }}: ${{ env.NOTEBOOK }}"
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data
            scans
            .github/workflows/import-notebook.yml
