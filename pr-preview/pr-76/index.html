<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observing Log</title>
  <meta name="description" content="Astronomy observations transcribed from paper notes.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/icon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div class="preview-banner" data-branch="11-search">Preview of PR #76: Search box above the home page's tabs. <a href="https://github.com/Kacy-Luker/astronomy/pull/76">View the pull request</a></div>
  <header class="site-header">
    <h1><a href="./">Observing Log</a></h1>
    <p class="tagline">Kacy Luker's astronomy notes</p>
  </header>

  <main>
    <p id="summary" class="summary">Loading…</p>
    <div class="tabs" role="tablist" aria-label="Browse by">
      <a role="tab" id="tab-notebooks" href="#notebooks" aria-controls="notebooks">Notebooks</a>
      <a role="tab" id="tab-sessions" href="#sessions" aria-controls="sessions">Sessions</a>
      <a role="tab" id="tab-sketches" href="#sketches" aria-controls="sketches">Sketches</a>
    </div>
    <section id="notebooks" role="tabpanel" aria-labelledby="tab-notebooks" hidden>
      <ul class="sessions"></ul>
    </section>
    <section id="sessions" role="tabpanel" aria-labelledby="tab-sessions" hidden>
      <ol class="sessions"></ol>
    </section>
    <section id="sketches" role="tabpanel" aria-labelledby="tab-sketches" hidden></section>
  </main>

  <script type="module" src="app.js"></script>
  <footer class="site-footer muted">
    Object data from <a href="https://github.com/mattiaverga/OpenNGC">OpenNGC</a> (CC BY-SA 4.0).
    <a href="https://github.com/Kacy-Luker/astronomy/blob/main/data/personalObjectMappings.json">Kacy's object mappings</a>.
  </footer>
</body>
</html>
