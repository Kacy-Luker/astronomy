name: Docs

# On each pull request that changes code, Claude reads the change and updates
# README.md and CLAUDE.md where they no longer match it. The fix is
# committed to the pull request's branch, and a comment on the pull request
# says what changed and links the commit. Import pull requests (data and
# scans only) are skipped.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/**"
      - "site/**"
      - "schema/**"
      - "data/categories.json"
      - ".github/workflows/**"
      - "package.json"
      - "requirements.txt"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  docs:
    # Only branches in this repo can be pushed to; import and remove pull
    # requests only change data, so their docs don't need checking.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'import/') && !startsWith(github.head_ref, 'remove/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # SCANS_TOKEN (a personal token, as for imports) pushes the docs commit,
      # so the pull request's checks run on it. Pushes with the built-in
      # token wait for someone to approve their runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.SCANS_TOKEN }}
      # The run started by this workflow's own docs commit has nothing to do.
      - name: Check for our own docs commit
        id: own
        run: |
          if [ "$(git log -1 --format='%an|%s')" = "github-actions[bot]|Update docs for this change" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The newest commit is this workflow's docs update; nothing to check." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: anthropics/claude-code-action@v1
        if: steps.own.outputs.skip != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            This pull request (#${{ github.event.number }}: ${{ github.event.pull_request.title }})
            changes code in this repository. Run `git diff origin/${{ github.base_ref }}...HEAD`
            to see the change.

            Update README.md and CLAUDE.md where they no longer match the code after this
            change: commands, workflow actions and inputs, file layout, data formats, and how
            the import, build and site behave. README.md is for Kacy using the site and the
            Import form; CLAUDE.md is context for agents changing the code.

            - Change only what the code change makes wrong or leaves out. Don't rewrite
              sections that are still right, and don't add a changelog.
            - Match each file's existing style: short plain sentences, the same headings and
              tables. Rewrap any paragraph you edit so no line is longer than the lines
              around it (about 74 characters).
            - Edit only README.md and CLAUDE.md. Don't commit; that's done after you.
            - If nothing needs changing, change nothing.

            If you changed anything, write a short summary for the pull request to
            docs-summary.md (it isn't committed): one bullet per change, each naming the
            file and section and saying what changed and why, in plain words. Check it
            against `git diff` first and describe only what that shows; a rewrap is just
            a rewrap.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
      - name: Commit the doc updates
        if: steps.own.outputs.skip != 'true'
        id: commit
        env:
          BRANCH: ${{ github.head_ref }}
          TOKEN: ${{ secrets.SCANS_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
        run: |
          # The Claude step swaps in the base branch's CLAUDE.md while Claude
          # works (it treats the pull request's copy as untrusted), so
          # Claude's edits are to that copy. Merge them onto this branch's
          # CLAUDE.md; if they clash, keep this branch's.
          git show HEAD:CLAUDE.md > "$RUNNER_TEMP/ours"
          git show "origin/$BASE:CLAUDE.md" > "$RUNNER_TEMP/base" 2>/dev/null || cp "$RUNNER_TEMP/ours" "$RUNNER_TEMP/base"
          cp CLAUDE.md "$RUNNER_TEMP/theirs"
          if ! git merge-file -p "$RUNNER_TEMP/ours" "$RUNNER_TEMP/base" "$RUNNER_TEMP/theirs" > CLAUDE.md; then
            git checkout HEAD -- CLAUDE.md
            echo "- CLAUDE.md: Claude's edits clashed with this branch's changes, so they were left out." >> docs-summary.md
          fi
          # Only the docs are kept; anything else Claude touched is dropped.
          git checkout -- $(git diff --name-only | grep -vxE 'README\.md|CLAUDE\.md') 2>/dev/null || true
          if git diff --quiet -- README.md CLAUDE.md; then
            echo "The docs already match this change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update docs for this change" -- README.md CLAUDE.md
          # Pushed with SCANS_TOKEN by URL: the Claude step points git's own
          # credentials at the built-in token, whose pushes wait for approval.
          # The checks run on this commit; the docs check skips it (above).
          git -c http.https://github.com/.extraheader= push "https://x-access-token:$TOKEN@github.com/$REPO.git" "HEAD:$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          { echo "Updated the docs:"; echo '```diff'; git show --stat --format= HEAD; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Say on the pull request what changed
        if: steps.commit.outputs.sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
          PR: ${{ github.event.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "**Docs updated** in $SHA by the Docs workflow ([run]($RUN))."
            echo
            if [ -s docs-summary.md ]; then cat docs-summary.md; else
              git show --stat --format= HEAD | sed '$d' | sed 's/^ */- /'
            fi
            echo
            echo "<details><summary>Diff</summary>"
            echo
            echo '```diff'
            git show --format= HEAD
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
