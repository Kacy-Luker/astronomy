name: Import session

# Run from the Actions tab after uploading a scan to the private
# astronomy-scans repo as <notebook id>/<date>.pdf. Opens a pull request
# with the new pages and sessions.
on:
  workflow_dispatch:
    inputs:
      notebook:
        description: "Notebook id, e.g. astronomy-001"
        required: true
      scan:
        description: "File in astronomy-scans (default: the newest file in the notebook's folder)"
        required: false
      completed:
        description: "This was the last session in the notebook"
        type: boolean
        default: false
      title:
        description: "Title, only for a brand new notebook (default: read from its label)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-${{ inputs.notebook }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOTEBOOK: ${{ inputs.notebook }}
      SCAN: ${{ inputs.scan }}
      TITLE: ${{ inputs.title }}
      COMPLETED: ${{ inputs.completed }}
    steps:
      - name: Check inputs
        run: |
          [[ "$NOTEBOOK" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::Notebook id must be lowercase letters, digits and dashes"; exit 1; }
          [[ "$SCAN" != *..* ]] || { echo "::error::Scan path can't contain '..'"; exit 1; }
      - uses: actions/checkout@v4
      - name: Fetch the private scans
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/astronomy-scans
          token: ${{ secrets.SCANS_TOKEN }}
          path: .scans
      - name: Pick the scan
        run: |
          if [ -z "$SCAN" ]; then
            # Names are dates (optionally -HHMM), so the newest upload sorts
            # last. Compare without the extension so 2026-10-23.pdf comes
            # before 2026-10-23-1350.pdf.
            SCAN=$(cd .scans && for f in "$NOTEBOOK"/*; do
              [ -f "$f" ] && printf '%s\t%s\n' "${f%.*}" "$f"
            done | LC_ALL=C sort | tail -n 1 | cut -f2)
            [ -n "$SCAN" ] || { echo "::error::No files in astronomy-scans/$NOTEBOOK/"; exit 1; }
          fi
          [ -e ".scans/$SCAN" ] || { echo "::error::astronomy-scans has no $SCAN"; exit 1; }
          echo "Importing $SCAN"
          echo "SCAN=$SCAN" >> "$GITHUB_ENV"
          echo "BRANCH=import/$NOTEBOOK-$(basename "${SCAN%.*}" | tr -c 'A-Za-z0-9.\n-' '-')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: command -v pdfimages || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: npm ci
      - name: Import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=()
          [ -n "$TITLE" ] && args+=(--title "$TITLE")
          [ "$COMPLETED" = "true" ] && args+=(--completed)
          node scripts/import-notebook.mjs "$NOTEBOOK" ".scans/$SCAN" "${args[@]}" --summary "$RUNNER_TEMP/summary.md"
      - run: npm run validate
      - name: Remove the unredacted scans
        run: rm -rf .scans
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH }}
          title: Import ${{ env.SCAN }}
          commit-message: Import ${{ env.SCAN }}
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data
            scans
